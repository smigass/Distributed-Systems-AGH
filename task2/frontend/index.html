<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css"/>
    <link rel="stylesheet" href="./lib/leaflet-2.0.0-alpha.1/dist/leaflet.css"/>
    <title>Radar app</title>
</head>
<script>
    
</script>
<body>
        <main>
            <div id="main-div">
                <div id="map-container">
                    <div id="map"></div>
                </div>
                <div id="form-div">
                    <div class="form">
                        <h2>Search for flights</h2>
                        <form id="search-form" onsubmit="findDepartures()">
                            <label for="origin">Departure Airport (ICAO):</label><br>
                            <input type="text" id="origin" name="origin"><br>
                            <label for="destination">Destination Airport (ICAO):</label><br>
                            <input type="text" id="destination" name="destination"><br>
                            <label for="datetime-local">Departure time</label><br>
                            <input type="datetime-local" id="datetime-local" value="" name="datetime-local"><br>
                            <input type="submit" value="Search">
                        </form>
                    </div>
                </div>
            </div>
            <div class="list" id="flights-list">
                <h2>Flights</h2>
            </div>
        </main>


        <script src="./scripts/FlightCard.js" type="module"></script>
        <script src="./scripts/actions.js"></script>
        <script src="./scripts/main.js" type="module"></script>
</body>
</html>
