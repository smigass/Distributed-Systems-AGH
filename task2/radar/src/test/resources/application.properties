opensky.api.token-management=custom
opensky.api.client-id=test-client-id
opensky.api.client-secret=test-client-secret
opensky.api.token-url=http://localhost/token
opensky.api.token-margin=15

spring.security.oauth2.client.registration.opensky.client-id=test-client-id
spring.security.oauth2.client.registration.opensky.client-secret=test-client-secret
spring.security.oauth2.client.registration.opensky.scope=read
spring.security.oauth2.client.registration.opensky.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.opensky.token_uri=http://localhost/token

aerobox.api.key=test-aerobox-key
aviationstack.api.key=test-aviationstack-key

spring.task.scheduling.enabled=false



