version: '3.8'

services:
  ray-head:
    image: rayproject/ray:latest-py310
    ports:
      - "8265:8265"    
      - "10001:10001"   
      - "6379:6379"    
    command: bash -c "ray start --head --dashboard-port=8265 --port=6379 --dashboard-host=0.0.0.0 --num-cpus=2 --block"
    shm_size: 2g
    environment:
      - RAY_ADDRESS=ray://ray-head:10001

  ray-worker:
    image: rayproject/ray:latest-py310
    depends_on:
      - ray-head
    command: bash -c "ray start --address=ray-head:6379 --num-cpus=2 --block"
    shm_size: 2g
    deploy:
      replicas: 3       
       
  jupyter-client:
    image: rayproject/ray:latest-py310
    depends_on:
      - ray-head
      - ray-worker
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - RAY_ADDRESS=ray://ray-head:10001
    command: bash -c "pip install jupyter && jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"